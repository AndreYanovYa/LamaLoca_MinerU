app:
  name: "lama-loca"
  language: "ru"
  # ТЗ «Кастомизация под студента БГУ ФПМиИ»: Ф.И.О. отображается в заголовке
  # окна; редактируется во вкладке Настройки (сохраняется сюда же).
  student_name: "Ф.И.О. студента"

storage:
  root: "data"
  sqlite_path: "data/storage/library.db"
  chroma_path: "data/storage/chroma"

ollama:
  base_url: "http://127.0.0.1:11434"
  chat_model: "qwen3:4b" # Или Qwen3:latest, как у вас в списке
  embedding_model: "bge-m3" # Отличная модель, уже загружена у вас!
  timeout_seconds: 180
  keep_alive_seconds: -1 # Держать модели в VRAM (-1 бессрочно; иначе каждая
                         # серия запросов начинается с медленной загрузки весов)
  gpu_check: true        # Предупреждать при старте, если Ollama считает на CPU
  # Потолок токенов ВХОДЯЩЕГО промпта (анти-«немой пустой ответ» при KV-кэше
  # больше реальной ёмкости VRAM). 0 = адаптивный режим: старт 12000 токенов,
  # автоповышение до 20000 после подтверждения GPU-инференса (~70 ток/с).
  # Ручной потолок отключает автоповышение (например: 12000 — слабее VRAM,
  # 20000 — сразу для RTX 5060 8ГБ). Аналог env: OLLAMA_EFFECTIVE_PROMPT_TOKENS.
  effective_prompt_tokens: 0
  # Перед запуском MinerU выгружать модели Ollama из VRAM (keep_alive=0s),
  # чтобы парсер получил всю видеопамять и не ушёл в CPU-режим.
  unload_for_parse: true

search:
  fts_top_k: 30
  vector_top_k: 30
  final_top_k: 16

chunking:
  target_tokens: 500
  overlap_tokens: 100
  min_tokens: 100
  max_tokens: 800
  preserve_headings: true
  preserve_formulas: true
  preserve_code_blocks: true

external_tools:
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  djvutxt_cmd: "djvutxt"
  ddjvu_cmd: "ddjvu"
  ebook_convert_cmd: "ebook-convert"

offline:
  enabled: true
# --- Распознавание формул из PDF (Image-to-LaTeX) ---
# Текстовый слой PDF превращает математику в нечитаемую кашу; pix2tex/texify
# распознают PNG-зоны формул в LaTeX, который попадает в обучение и RAG.
# engine: auto | pix2tex | texify | api | off
formula_ocr:
  engine: "auto"
  allow_network_api: false

# --- Движок разбора PDF (MinerU — основной, PyMuPDF — fallback) ---
# engine: auto | mineru | pymupdf
pdf_engine:
  engine: "auto"
  languages: "ru,en"     # коды языков; для MinerU-OCR выбирается один (ru→cyrillic)
  # fast_batch: при истине перед парсингом выгружаются модели Ollama, MinerU
  # запускается на GPU и объявляет карте MINERU_VIRTUAL_VRAM_SIZE = vram_gb_override
  # (или 16 ГБ по умолчанию) — это поднимает Batch Ratio MinerU с 1 до 8 на
  # RTX 5060 8ГБ. 0/auto в vram_gb_override = штатный расчёт по реальному объёму.
  fast_batch: true
  vram_gb_override: 0    # явный «виртуальный» объём VRAM для Batch Ratio (0 = авто: 16)
